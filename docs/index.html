<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HEBPath</title>
    <meta name="theme-color" content="#e4002b" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* ============================================================
         HEBPath — store WAYFINDING, built like a transit diagram.
         THESIS  A route diagram, not a document. Refuses cream-paper
                 editorial minimal; reads like a night-mode transit
                 map / departure board for one store.
         WORLD   Black ground, white as the only signal. The route,
                 the station discs and the line-spine are white on a
                 near-black plan; termini are hollow rings. Libre
                 Franklin (Franklin Gothic lineage — transit / signage).
                 Weight carries hierarchy, not hairlines.
         FORM    Transit diagram, dark. Color strategy: Drenched (black).
         ============================================================ */
      *, *::before, *::after { box-sizing:border-box; }
      html, body { overflow-x:hidden; }

      :root{
        --bg:       #0c0d0f;   /* black ground */
        --panel:    #121316;   /* legend / bars */
        --elev:     #191b1f;
        --ink:      #f5f6f8;   /* near-white text */
        --ink-70:   #b4b7be;
        --ink-45:   #797c84;
        --line:     #2b2d33;   /* structural rules */
        --line-2:   #202227;
        --plan:     #141518;   /* map floor */
        --fixture:  #24262b;
        --fixture-ln:#33363c;
        --signal:   #ffffff;   /* the one bright thing: the route */
        --topbar-h: 60px;
        --sans: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      html, body{ height:100%; background:var(--bg); color:var(--ink); }
      body{ margin:0; font:400 14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }

      /* the signage voice: Franklin Black, tight, uppercase */
      .sign{ font-weight:900; letter-spacing:-.01em; text-transform:uppercase; }

      /* ---------------- shell ---------------- */
      .app{ display:grid; grid-template-rows:auto 1fr auto; height:100dvh; }

      /* MASTHEAD — dark bar under a bright rule, like a departure board header */
      .topbar{
        position:relative; z-index:5;
        display:flex; align-items:center; justify-content:space-between; gap:16px;
        height:var(--topbar-h); padding:0 18px;
        background:var(--panel); color:var(--ink); border-bottom:2px solid var(--signal);
      }
      h1{ margin:0; font-weight:900; font-size:24px; letter-spacing:-.02em; text-transform:lowercase; }
      h1 .heb{ color:var(--ink); }
      h1 .path{ color:var(--ink-45); }

      .topbar .row{ display:flex; align-items:center; gap:16px; }
      #status{ min-height:1em; font-size:12px; font-weight:600; color:var(--ink-70); }
      #instrucLink{
        font-size:12px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
        color:var(--ink); text-decoration:none;
        padding:7px 13px; border:1.5px solid var(--line); border-radius:999px;
      }
      #instrucLink:visited{ color:var(--ink); }
      #instrucLink:hover{ background:var(--signal); color:var(--bg); border-color:var(--signal); }

      /* loading: bright progress sweep along the header rule */
      .progress{ position:absolute; left:0; right:0; bottom:-2px; height:2px; overflow:hidden; }
      .progress::after{
        content:""; position:absolute; inset:0 auto 0 0; width:35%;
        background:var(--signal); animation:sweep 1.1s cubic-bezier(.5,0,.5,1) infinite;
      }
      @keyframes sweep{ 0%{ left:-35%; } 100%{ left:100%; } }

      /* ---------------- map ---------------- */
      .main{ position:relative; min-height:0; }
      .stage{ position:relative; width:100%; height:100%; background:var(--plan); overflow:hidden; touch-action:none; }
      .stage svg{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
      .stage svg:active{ cursor:grabbing; }
      #out{ position:absolute; inset:0; overflow:hidden; touch-action:none; z-index:0; }
      #out > svg{ position:absolute; inset:0; z-index:0; }

      /* ---------------- route legend (the "line") ---------------- */
      .panel{
        position:absolute; top:0; right:0; bottom:0;
        width:clamp(300px, 28vw, 396px);
        display:flex; flex-direction:column;
        background:var(--panel);
        border-left:1px solid var(--line);
        z-index:10;
      }
      .panel-header{
        display:flex; align-items:center; justify-content:space-between; gap:10px;
        padding:16px 18px 14px; border-bottom:1px solid var(--line);
      }
      .panel-header h2{ margin:0; font-weight:900; font-size:15px; letter-spacing:.02em; text-transform:uppercase; }
      #stopCount{
        font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
        color:var(--bg); background:var(--signal); padding:4px 9px; border-radius:999px;
      }

      .steps{ list-style:none; margin:0; padding:14px 0 14px; overflow:auto; flex:1 1 auto; -webkit-overflow-scrolling:touch; }
      .step{
        position:relative;
        display:grid; grid-template-columns:30px 1fr; align-items:center; gap:14px;
        padding:9px 18px; cursor:pointer;
      }
      /* white line-segment linking each stop to the next — the transit "line" */
      .step:not(:last-child)::before{
        content:""; position:absolute; left:31.5px; top:50%; height:100%; width:3px;
        background:var(--signal); z-index:0;
      }
      .step:hover .desc{ color:#fff; }
      .step:hover .badge{ transform:scale(1.12); }
      .step[aria-current="true"] .badge{ box-shadow:0 0 0 4px rgba(255,255,255,.22); }
      .step[aria-current="true"] .desc{ font-weight:800; }
      .badge{
        position:relative; z-index:1;
        width:30px; height:30px; display:grid; place-items:center;
        font-weight:800; font-size:13px; color:var(--bg); background:var(--signal);
        border-radius:50%; box-shadow:0 0 0 3px var(--panel);
        transition:transform .12s ease-out;
      }
      /* start + end of the line are hollow rings, like terminus stations */
      .step:first-child .badge, .step:last-child .badge{
        background:var(--panel); color:var(--ink); box-shadow:0 0 0 3px var(--panel), inset 0 0 0 2.5px var(--signal);
      }
      .desc{ font-size:14.5px; font-weight:600; line-height:1.25; color:var(--ink); transition:color .12s; }
      .muted{ margin-top:2px; font-size:12px; font-weight:500; color:var(--ink-45); }
      .panel-foot{ padding:11px 18px; border-top:1px solid var(--line); font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-45); }

      /* ---------------- footer ---------------- */
      .footbar{
        display:flex; align-items:center; gap:16px; flex-wrap:wrap;
        padding:8px 18px; background:var(--panel); border-top:1px solid var(--line);
      }
      #error{ color:#ff6b6b; font-size:12.5px; font-weight:600; white-space:pre-wrap; }
      details.log summary{
        list-style:none; cursor:pointer;
        font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-45);
      }
      details.log summary::-webkit-details-marker{ display:none; }
      details.log summary::before{ content:"▸ "; }
      details.log[open] summary::before{ content:"▾ "; }
      details.log summary:hover{ color:var(--ink); }
      details.log textarea{
        display:block; width:100%; height:150px; margin-top:8px; resize:vertical;
        background:var(--elev); color:var(--ink-70);
        border:1px solid var(--line); border-radius:4px; padding:8px;
        font:12px/1.5 var(--mono);
      }

      /* ---------------- mobile: legend becomes a bottom sheet ---------------- */
      @media (max-width:760px){
        .panel{
          position:fixed; top:auto; bottom:0;
          left:env(safe-area-inset-left); right:env(safe-area-inset-right);
          width:auto; max-width:100%;
          height:clamp(200px, 38vh, 440px);
          border-left:none; border-top:2px solid var(--signal);
          padding-bottom:env(safe-area-inset-bottom);
          z-index:999;
        }
        .panel-foot{ display:none; }
        h1{ font-size:21px; }
      }

      .hidden{ display:none !important; }
    </style>

    <style>
      /* Transit station markers, drawn into the SVG via foreignObject.
         White disc, black number, dark halo so it reads on the plan.
         Terminus stops (entrance / checkout) are hollow rings. */
      .stop{
        width:100%; height:100%; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:#ffffff; color:#0c0d0f; font-weight:800;
        font-family:"Libre Franklin", system-ui, sans-serif;
        box-shadow:0 0 0 2.5px #0c0d0f, 0 1px 4px rgba(0,0,0,.5);
      }
      .stop.terminal{ background:#0c0d0f; color:#ffffff; box-shadow:0 0 0 2.5px #0c0d0f, inset 0 0 0 2.5px #ffffff, 0 1px 4px rgba(0,0,0,.5); }
      .stop .text-layer{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    </style>
  </head>
  <body>
    <div class="app" id="appRoot">
      <header class="topbar">
        <h1><span class="heb">heb</span><span class="path">path</span></h1>

        <div class="row">
          <small id="status"></small>
          <a href="./instruc" id="instrucLink">Setup</a>
        </div>

        <div id="loader" class="progress hidden" aria-live="polite" aria-busy="true"></div>
      </header>

      <div class="main">
        <div class="stage" id="stage">
          <div id="out"></div>

          <aside class="panel" id="side" aria-label="Your route through the store">
            <div class="panel-header">
              <h2>Your route</h2>
              <span id="stopCount"></span>
            </div>
            <ul class="steps" id="steps"></ul>
            <div class="panel-foot">Tap a stop to zoom to it · drag to pan</div>
          </aside>
        </div>
      </div>

      <footer class="footbar">
        <span id="error"></span>
        <details class="log">
          <summary>Log</summary>
          <textarea id="json" placeholder="Paste your cart JSON here if the clipboard is blocked"></textarea>
        </details>
      </footer>
    </div>

      <script>
        (function () {
          var base = document.createElement('base');
          var path = window.location.pathname;
          var isDemoPath = /\/demo\/?$/.test(path);

          // Treat the current path as a "directory"
          // "/"      -> "/"
          // "/heb"   -> "/heb/"
          // "/heb/"  -> "/heb/"
          // "/heb-pathfinder/" -> "/heb-pathfinder/"
          if (isDemoPath) {
            base.href = path.replace(/demo\/?$/, "");
          } else if (path === "" || path === "/") {
            base.href = "/";
          } else if (path.endsWith("/")) {
            base.href = path;
          } else {
            base.href = path + "/";
          }

          document.head.appendChild(base);
        })();
      </script>

    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script type="module">
      import init, { heb_entry } from "./heb_scout.js";

      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      const errEl    = $("error");
      const stepsEl  = $("steps");
      const panelEl  = $("side");
      const stageEl  = $("stage");

      const setStatus = (m) => statusEl.textContent = m ?? "";
      const setError  = (m) => errEl.textContent = m ?? "";

      // Toggles the hairline progress bar under the topbar.
      function setLoading(show, msg){
        const el = document.getElementById('loader');
        if (typeof msg === 'string') setStatus(msg);
        if (!el) return;
        el.classList.toggle('hidden', !show);
      }

      /* ----- overlay orientation detection ----- */
      const mqlBottom = window.matchMedia("(max-width: 700px)");
      function applyOverlayOrientation(){
        if (!panelEl) return;
        panelEl.dataset.orientation = mqlBottom.matches ? "bottom" : "right";
      }
      applyOverlayOrientation();
      mqlBottom.addEventListener?.("change", applyOverlayOrientation);
      window.addEventListener("resize", applyOverlayOrientation);

      /* ---------- data source & cache ---------- */
      const isDemo = /\/demo\/?$/.test(location.pathname);
      const demoDataUrl = isDemo ? new URL("demo/data.json", document.baseURI) : null;
      if (isDemo) {
        history.replaceState(null, "", new URL("demo", document.baseURI).pathname);
      }

      const storageNamespace = isDemo ? "heb_scout:demo" : "heb_scout";
      const LS_KEY_FRAGMENT = `${storageNamespace}:fragment`;   // compressed fragment string (raw)
      const LS_KEY_CACHE    = `${storageNamespace}:cache`;      // structured cache

      function getFragmentFromUrlOrStorage() {
        const urlFrag = location.hash ? location.hash.slice(1) : "";
        if (urlFrag) {
          try { localStorage.setItem(LS_KEY_FRAGMENT, urlFrag); } catch {}
          try { history.replaceState(null, "", location.pathname + location.search); } catch {}
          return urlFrag;
        }
        try { return localStorage.getItem(LS_KEY_FRAGMENT) || ""; } catch { return ""; }
      }

      // Simple deterministic string hash (djb2)
      function hashStr(str){
        let h = 5381; for (let i=0;i<str.length;i++){ h = ((h<<5)+h) ^ str.charCodeAt(i); }
        // return as unsigned 32-bit hex
        return (h>>>0).toString(16);
      }

      function loadCache(){
        try { const raw = localStorage.getItem(LS_KEY_CACHE); return raw ? JSON.parse(raw) : null; }
        catch { return null; }
      }
      function saveCache(obj){
        try { localStorage.setItem(LS_KEY_CACHE, JSON.stringify(obj)); } catch {}
      }

      /* ✅ NEW: visible client area outside the panel (for pan/zoom + framing) */
      function getVisibleClientWH(){
        const panel = document.getElementById('side');
        const stage = document.getElementById('stage');
        if (!stage) return { vw: 1, vh: 1, frac: 0, orient: "right" };

        const sbox = stage.getBoundingClientRect();
        let vw = Math.max(1, sbox.width);
        let vh = Math.max(1, sbox.height);
        let frac = 0;
        let orient = (panel?.dataset.orientation) || "right";

        if (panel){
          const pbox = panel.getBoundingClientRect();
          if (orient === "right"){
            const hideW = Math.min(pbox.width, sbox.width);
            vw = Math.max(1, vw - hideW);
            frac = Math.min(0.95, Math.max(0, hideW / Math.max(1, sbox.width)));
          } else {
            const hideH = Math.min(pbox.height, sbox.height);
            vh = Math.max(1, vh - hideH);
            frac = Math.min(0.95, Math.max(0, hideH / Math.max(1, sbox.height)));
          }
        }
        return { vw, vh, frac, orient };
      }

      /* -------- SVG helpers (pan/zoom + mount) -------- */
      function mountSVG(svgString, { target, id = "output-svg" } = {}) {
        const doc = new DOMParser().parseFromString(svgString, "image/svg+xml");
        const err = doc.querySelector("parsererror");
        if (err) throw new Error("Invalid SVG: " + err.textContent?.trim());
        const svg = doc.documentElement; svg.id = id;
        const mounted = document.adoptNode(svg, true);
        target.replaceChildren(mounted);
        stops = [];   // markers belong to the SVG we just replaced

        // Ensure numeric viewBox
        (function ensureNumericViewBox(){
          let vb = mounted.getAttribute('viewBox');
          if (!vb) {
            let box;
            try { box = mounted.getBBox(); }
            catch {
              const r = mounted.getBoundingClientRect();
              box = { x: 0, y: 0, width: Math.max(1, r.width), height: Math.max(1, r.height) };
            }
            if (!box || !isFinite(box.width) || !isFinite(box.height) || !box.width || !box.height) {
              box = { x: 0, y: 0, width: 1000, height: 1000 };
            }
            vb = `${box.x} ${box.y} ${box.width} ${box.height}`;
            mounted.setAttribute('viewBox', vb);
          }
          mounted.dataset.initialVb = vb;
        })();

        // pan + zoom state
        let viewBox = { x: 0, y: 0, w: 0, h: 0 };
        let isPanning = false; 
        let startPoint = { x: 0, y: 0 }; 
        let pointStart = { x: 0, y: 0 };

        function getViewBox() {
          const [x,y,w,h] = mounted.getAttribute('viewBox').split(/[\s,]+/).map(Number);
          return { x, y, w, h };
        }
        function setViewBox(x, y, w, h) { mounted.setAttribute('viewBox', `${x} ${y} ${w} ${h}`); rescaleStops(); }

        function getVisibleClientSize(mounted){
          const bbox = mounted.getBoundingClientRect();
          const panel = panelEl;
          const stage = stageEl;

          let vw = bbox.width;
          let vh = bbox.height;

          if (panel && stage){
            const sbox = stage.getBoundingClientRect();
            const pbox = panel.getBoundingClientRect();
            const orient = panel.dataset.orientation || "right";

            if (orient === "right"){
              const ww = Math.min(pbox.width, sbox.width);
              vw = Math.max(1, bbox.width - ww);
            } else {
              const hh = Math.min(pbox.height, sbox.height);
              vh = Math.max(1, bbox.height - hh);
            }
          }
          return { vw, vh, bbox };
        }

        function clientToSvgXY(clientX, clientY) {
          const { vw, vh, bbox } = getVisibleClientSize(mounted);
          const v = getViewBox();
          const relX = (clientX - bbox.left) / Math.max(1, vw);
          const relY = (clientY - bbox.top)  / Math.max(1, vh);
          const x = v.x + relX * v.w;
          const y = v.y + relY * v.h;
          return { x, y, bbox, v, vw, vh, relX, relY };
        }

        function getObstruction() {
          const panel = panelEl, stage = stageEl;
          if (!panel) return { orient: "right", frac: 0 };
          const orient = panel.dataset.orientation || "right";
          const pbox = panel.getBoundingClientRect();

          if (orient === "bottom") {
            const vh = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
            const frac = Math.min(0.95, Math.max(0, pbox.height / vh));
            return { orient: "bottom", frac };
          } else {
            const sbox = stage?.getBoundingClientRect();
            const sw = Math.max(1, sbox?.width || window.innerWidth || 1);
            const frac = Math.min(0.95, Math.max(0, pbox.width / sw));
            return { orient: "right", frac };
          }
        }

        function handleWheel(event){
          const panel = panelEl;
          if (panel){
            const pbox = panel.getBoundingClientRect();
            if (
              event.clientX >= pbox.left && event.clientX <= pbox.right &&
              event.clientY >= pbox.top  && event.clientY <= pbox.bottom
            ) {
              event.preventDefault();
              return;
            }
          }
          event.preventDefault();

          const {x:svgX,y:svgY,v, relX, relY} = clientToSvgXY(event.clientX, event.clientY);

          const zoomFactor = event.deltaY > 0 ? 1.1 : 0.9;
          let newW = v.w * zoomFactor, newH = v.h * zoomFactor;

          let newX = svgX - relX * newW; 
          let newY = svgY - relY * newH;

          const { orient, frac } = getObstruction();
          if (frac > 0) {
            if (orient === "right") {
              const visibleRight = newX + newW * (1 - frac);
              const currentVisibleRight = v.x + v.w * (1 - frac);
              if (visibleRight < currentVisibleRight) {
                const delta = currentVisibleRight - visibleRight;
                newX -= delta;
              }
            } else {
              const visibleBottom = newY + newH * (1 - frac);
              const currentVisibleBottom = v.y + v.h * (1 - frac);
              if (visibleBottom < currentVisibleBottom) {
                const delta = currentVisibleBottom - visibleBottom;
                newY -= delta;
              }
            }
          }
          setViewBox(newX, newY, newW, newH);
        }

        function startPan(e){ 
          isPanning = true; 
          mounted.style.cursor='grabbing'; 
          const { bbox } = getVisibleClientSize(mounted);
          startPoint = {x:e.clientX - bbox.left, y:e.clientY - bbox.top}; 
          viewBox=getViewBox(); 
          pointStart={x:viewBox.x,y:viewBox.y}; 
        }
        function movePan(e){ 
          if(!isPanning) return; 
          const { vw, vh, bbox } = getVisibleClientSize(mounted);
          const pt={x:e.clientX-bbox.left,y:e.clientY-bbox.top}; 
          const dx=(pt.x-startPoint.x)*(viewBox.w/Math.max(1, vw));
          const dy=(pt.y-startPoint.y)*(viewBox.h/Math.max(1, vh));
          setViewBox(pointStart.x-dx, pointStart.y-dy, viewBox.w, viewBox.h); 
        }
        function endPan(){ isPanning=false; mounted.style.cursor='grab'; }

        let pinch = { active: false, startDist: 0, startVB: null, startCenterSvg: {x:0,y:0} };
        function distance(p1, p2){ const dx = p1.clientX - p2.clientX; const dy = p1.clientY - p2.clientY; return Math.hypot(dx, dy); }
        function midpoint(p1, p2){ return { clientX: (p1.clientX + p2.clientX)/2, clientY: (p1.clientY + p2.clientY)/2 }; }

        function onTouchStart(ev){
          ev.preventDefault();
          if (ev.touches.length === 1) {
            const t = ev.touches[0];
            const { bbox } = getVisibleClientSize(mounted);
            startPoint = { x: t.clientX - bbox.left, y: t.clientY - bbox.top };
            viewBox = getViewBox();
            pointStart = { x: viewBox.x, y: viewBox.y };
            isPanning = true;
          } else if (ev.touches.length === 2) {
            isPanning = false;
            pinch.active = true;
            pinch.startDist = distance(ev.touches[0], ev.touches[1]);
            pinch.startVB = getViewBox();
            const mid = midpoint(ev.touches[0], ev.touches[1]);
            const c = clientToSvgXY(mid.clientX, mid.clientY);
            pinch.startCenterSvg = { x: c.x, y: c.y };
          }
        }
        function onTouchMove(ev){
          if (!ev.touches.length) return;
          ev.preventDefault();
          if (pinch.active && ev.touches.length === 2) {
            const curDist = distance(ev.touches[0], ev.touches[1]) || 1;
            const scale = pinch.startDist / curDist;
            const newW = pinch.startVB.w * scale;
            const newH = pinch.startVB.h * scale;
            const newX = pinch.startCenterSvg.x - newW/2;
            const newY = pinch.startCenterSvg.y - newH/2;
            setViewBox(newX, newY, newW, newH);
            return;
          }
          if (isPanning && ev.touches.length === 1) {
            const t = ev.touches[0];
            const { vw, vh, bbox } = getVisibleClientSize(mounted);
            const pt = { x: t.clientX - bbox.left, y: t.clientY - bbox.top };
            const dx=(pt.x-startPoint.x)*(viewBox.w/Math.max(1, vw));
            const dy=(pt.y-startPoint.y)*(viewBox.h/Math.max(1, vh));
            setViewBox(pointStart.x-dx, pointStart.y-dy, viewBox.w, viewBox.h);
          }
        }
        function onTouchEnd(ev){ if (ev.touches.length === 0) { isPanning = false; pinch.active = false; } if (ev.touches.length === 1)  { pinch.active = false; } }

        mounted.addEventListener('wheel', handleWheel, { passive: false });
        mounted.addEventListener('mousedown', startPan);
        mounted.addEventListener('mousemove', movePan);
        mounted.addEventListener('mouseup', endPan);
        mounted.addEventListener('mouseleave', endPan);
        mounted.addEventListener('touchstart', onTouchStart, { passive: false });
        mounted.addEventListener('touchmove',  onTouchMove,  { passive: false });
        mounted.addEventListener('touchend',   onTouchEnd,   { passive: false });
        mounted.addEventListener('touchcancel',onTouchEnd,   { passive: false });

        return mounted;
      }

      /* Repaint the store plan: paper floor, warm-grey fixtures with a hairline
         outline so aisles read as drawn shapes rather than flat blocks. */
      const MAP = { floor: '#141518', fixture: '#24262b', fixtureLine: '#33363c' };

      function recolorMountedSVG(){
        try{
          const mounted = document.getElementById('output-svg'); if(!mounted) return;
          const rects = Array.from(mounted.querySelectorAll('rect'));
          let bgFound = false;
          rects.forEach(r=>{
            const fill=(r.getAttribute('fill')||'').toLowerCase();
            if(!fill) return;
            if(fill.includes('255')||fill.includes('#fff')||fill.includes('white')){
              r.setAttribute('fill',MAP.floor); bgFound=true;
            }
          });
          if(!bgFound){
            const vb = mounted.getAttribute('viewBox');
            let x=0,y=0,w='100%',h='100%';
            if(vb){
              const p=vb.split(/[\s,]+/).map(Number);
              if(p.length===4){ x=p[0];y=p[1];w=p[2];h=p[3]; }
            }
            const NS='http://www.w3.org/2000/svg';
            const bg=document.createElementNS(NS,'rect');
            bg.setAttribute('x',x); bg.setAttribute('y',y);
            bg.setAttribute('width',w); bg.setAttribute('height',h);
            bg.setAttribute('fill',MAP.floor);
            mounted.insertBefore(bg, mounted.firstChild);
          }
          const polys = mounted.querySelectorAll('polygon, polyline');
          polys.forEach(p=>{
            p.setAttribute('fill',MAP.fixture);
            p.setAttribute('stroke',MAP.fixtureLine);
            p.setAttribute('stroke-width','0.6');
            p.setAttribute('vector-effect','non-scaling-stroke');
          });
          mounted.querySelectorAll('path').forEach(p=>{
            const f=p.getAttribute('fill');
            if(f && f.toLowerCase()!=='none') p.setAttribute('fill',MAP.fixture);
          });
          mounted.querySelectorAll('[style]').forEach(el=>{
            const s=el.getAttribute('style')||''; 
            if(/background\s*:\s*rgb\(255,\s*255,\s*255\)/i.test(s)||/background\s*:\s*#fff/i.test(s))
              el.setAttribute('style', s.replace(/background\s*:\s*[^;]+;?/i, ''));
          });
        }catch(e){ console.warn('recolorMountedSVG failed', e); }
      }

      function framePoints(svg, points, padding=0.12){
        if(!points.length) return;
        const xs = points.map(p=>p[0]);
        const ys = points.map(p=>p[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);

        const w = Math.max(1e-6, maxX - minX);
        const h = Math.max(1e-6, maxY - minY);
        const padX = w * padding; 
        const padY = h * padding;

        let neededW = Math.max(w + 2*padX, 20);
        let neededH = Math.max(h + 2*padY, 20);

        let cx = (minX + maxX)/2 - neededW/2;
        let cy = (minY + maxY)/2 - neededH/2;

        const { vw, vh, frac, orient } = getVisibleClientWH();
        const visAR = vw / vh;

        let viewW = neededW;
        let viewH = neededH;

        const neededAR = neededW / neededH;
        if (Math.abs(neededAR - visAR) > 1e-6){
          if (neededAR < visAR){
            const newW = neededH * visAR;
            const grow = newW - viewW;
            viewW = newW;
            cx -= grow/2;
          } else {
            const newH = neededW / visAR;
            const grow = newH - viewH;
            viewH = newH;
            cy -= grow/2;
          }
        }

        if (frac > 0){
          if (orient === "right"){
            const visibleFracW = Math.max(1e-6, 1 - frac);
            const visLeft  = cx;
            const visRight = cx + viewW * visibleFracW;
            const needRight = maxX + padX;
            if (visRight < needRight){
              const delta = needRight - visRight;
              cx += delta;
            }
            const needLeft = minX - padX;
            if (visLeft > needLeft){ cx = needLeft; }
          } else {
            const visibleFracH = Math.max(1e-6, 1 - frac);
            const visTop    = cy;
            const visBottom = cy + viewH * visibleFracH;
            const needBottom = maxY + padY;
            if (visBottom < needBottom){
              const delta = needBottom - visBottom;
              cy += delta;
            }
            const needTop = minY - padY;
            if (visTop > needTop){ cy = needTop; }
          }
        } else {
          cx = Math.min(cx, minX - padX);
          cy = Math.min(cy, minY - padY);
        }

        svg.setAttribute('viewBox', `${cx} ${cy} ${viewW} ${viewH}`);
        rescaleStops();
      }

      /* -------- WASM pipeline + UI helpers -------- */
      function buildProductInfo(payload){
        const productInfo = {};
        if (payload && Array.isArray(payload.data)) {
          payload.data.forEach(block => {
            if (!block || !Array.isArray(block.results)) return;
            const blockTitle = (block.title ?? '').trim();
            block.results.forEach(r => {
              const pid = (r && (r.productId || r.product_id)) || 0;
              if (!pid) return;
              let subtitle = '';
              if (r?.psas?.[0]?.locationDescription) subtitle = r.psas[0].locationDescription;
              else if (r?.approximateLocation?.locationDescription) subtitle = r.approximateLocation.locationDescription;
              else if (r?.locationDescription) subtitle = r.locationDescription;
              const fallbackName = r?.name || r?.productName || r?.description || '';
              const title = blockTitle || fallbackName;
              productInfo[pid] = { title: title || '', subtitle: subtitle || '' };
            });
          });
        }
        productInfo[1] = { title: 'Entrance',       subtitle: '' };
        productInfo[2] = { title: 'Checkout Area',  subtitle: '' };
        return productInfo;
      }

      const NS_SVG = 'http://www.w3.org/2000/svg';

      /* Route line: a bold transit stroke. A dark casing underneath separates
         it from fixtures; the white line on top carries the eye. */
      function drawRouteLine(g, pointsAttr){
        [{ color:'#0c0d0f', width:'8' }, { color:'#ffffff', width:'4' }].forEach(({color,width})=>{
          const poly = document.createElementNS(NS_SVG,'polyline');
          poly.setAttribute('points', pointsAttr);
          poly.setAttribute('fill','none');
          poly.setAttribute('stroke', color);
          poly.setAttribute('stroke-width', width);
          poly.setAttribute('stroke-linecap','round');
          poly.setAttribute('stroke-linejoin','round');
          poly.setAttribute('vector-effect','non-scaling-stroke');
          g.appendChild(poly);
        });
      }

      /* Stops live in SVG user space, so they'd balloon and shrink with the
         viewBox. We keep a registry and re-scale them on every view change so a
         stop is always ~STOP_PX across on screen. */
      const STOP_PX = 28;
      let stops = [];

      function rescaleStops(){
        const svg = document.getElementById('output-svg');
        if (!svg || !stops.length) return;
        const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
        if (vb.length !== 4 || !isFinite(vb[2])) return;
        const px = Math.max(1, svg.getBoundingClientRect().width);
        const k = vb[2] / px;                 // user units per screen pixel
        const size = STOP_PX * k;
        stops.forEach(({ fo, div, cx, cy }) => {
          fo.setAttribute('x', cx - size/2);
          fo.setAttribute('y', cy - size/2);
          fo.setAttribute('width', size);
          fo.setAttribute('height', size);
          div.style.fontSize = (12 * k) + 'px';
          div.style.boxShadow = `0 0 0 ${2*k}px #f6f3ec, 0 0 0 ${3*k}px rgba(26,24,20,.35)`;
        });
      }
      window.addEventListener('resize', rescaleStops);

      /* A numbered stop pinned at (sx, sy). First and last stop (the door and
         the checkout) are inked instead of red so the ends of the run stand out. */
      function makeStop({ n, sx, sy, tipText, terminal }){
        const size = STOP_PX;
        const fo = document.createElementNS(NS_SVG,'foreignObject');
        fo.setAttribute('x', Number(sx) - size/2);
        fo.setAttribute('y', Number(sy) - size/2);
        fo.setAttribute('width', size);
        fo.setAttribute('height', size);
        fo.setAttribute('pointer-events','none');
        fo.setAttribute('style','background:none; overflow:visible;');

        const div = document.createElement('div');
        div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
        div.className = terminal ? 'stop terminal' : 'stop';

        const span = document.createElement('div');
        span.className = 'text-layer';
        span.textContent = String(n);
        div.appendChild(span);
        fo.appendChild(div);

        if (tipText){
          const tip = document.createElementNS(NS_SVG,'title');
          tip.textContent = tipText;
          fo.appendChild(tip);
        }

        stops.push({ fo, div, cx: Number(sx), cy: Number(sy) });
        return fo;
      }

      function renderSteps(waypoints){
        stepsEl.replaceChildren();
        waypoints.forEach((wp, wi) => {
          const li = document.createElement('li');
          li.className = 'step';
          li.dataset.wi = wi;
          li.innerHTML = `
            <div class="badge">${wp.n}</div>
            <div>
              <div class="desc">${wp.title || wp.subtitle || 'Stop ' + wp.n}</div>
              ${wp.title && wp.subtitle ? `<div class="muted">${wp.subtitle}</div>` : ''}
            </div>`;
          stepsEl.appendChild(li);
        });
        const count = $("stopCount");
        if (count) count.textContent = waypoints.length ? `${waypoints.length} stops` : '';
      }

      /* Keep the list in sync with whatever the map is focused on. */
      function markCurrentStep(wi){
        Array.from(stepsEl.children).forEach((li, i) => {
          if (i === wi) li.setAttribute('aria-current','true');
          else li.removeAttribute('aria-current');
        });
      }

      function hookStepClicks(svg, waypoints, pts, toSvg){
        stepsEl.onclick = (e)=>{
          const li = e.target.closest('.step'); if(!li) return;
          const wi = Number(li.dataset.wi);
          const pair = computePairIndices(wi, waypoints.length);
          const svgPts = pair.map(i=>{
            const p = pts[waypoints[i].index];
            const [sx,sy] = toSvg(p[0], p[1]);
            return [sx,sy];
          });
          framePoints(svg, svgPts, 0.15);
          markCurrentStep(wi);
        };
      }

      // Same, for restores from cache, where waypoints already carry svg coords.
      function hookStepClicksAbs(svg, waypoints){
        stepsEl.onclick = (e)=>{
          const li = e.target.closest('.step'); if(!li) return;
          const wi = Number(li.dataset.wi);
          const pair = computePairIndices(wi, waypoints.length);
          const pts = pair.map(i=>[ waypoints[i].cx, waypoints[i].cy ]);
          framePoints(svg, pts, 0.15);
          markCurrentStep(wi);
        };
      }

function computePairIndices(wi, len){ if (len <= 1) return [0]; if (wi >= 0 && wi < len - 1) return [wi, wi + 1]; return [len - 1, 0]; }

      function validateLooksLikeJson(text){ try{ JSON.parse(text); return true; }catch{ return false; } }
      async function runWithData(jsonText) {
        setError("");
        try {
          if (!validateLooksLikeJson(jsonText)) throw new Error("That doesn’t look like cart data. Copy the cart again from the H-E-B page.");
          return heb_entry(jsonText);
        } catch (e) { console.error(e); setError(String(e)); setLoading(false, ""); }
      }

      /* ✅ NEW: draw overlay using cached structures (no WASM required) */
      function drawOverlayFromCache(svg, cache){
        const NS = 'http://www.w3.org/2000/svg';
        const g = document.createElementNS(NS,'g'); 
        g.setAttribute('pointer-events','none');

        if (cache.polyline) drawRouteLine(g, cache.polyline_points_svg.join(' '));

        const wps = cache.waypoints || [];
        wps.forEach((wp, i) => {
          g.appendChild(makeStop({
            n: wp.n, sx: wp.cx, sy: wp.cy, tipText: wp.tipText,
            terminal: i === 0 || i === wps.length - 1
          }));
        });

        svg.appendChild(g);
        rescaleStops();

        // Open on the whole run, so you can see the shape of the trip first.
        if ((cache.waypoints || []).length){
          framePoints(svg, cache.waypoints.map(w => [w.cx, w.cy]), 0.08);
        }
      }

      async function main(){
        const SETUP_URL = "./instruc";
        try { history.scrollRestoration = 'manual'; } catch {}
        if (location.hash) window.scrollTo(0, 0);

        setLoading(true, "Loading…");
        await init();

        let demoJson = null;
        let rawFrag = "";
        if (demoDataUrl) {
          setLoading(true, "Loading example route…");
          try {
            const response = await fetch(demoDataUrl, { cache: "no-cache" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            demoJson = await response.text();
            if (!validateLooksLikeJson(demoJson)) throw new Error("Invalid JSON");
            rawFrag = "demo";
          } catch (error) {
            console.error(error);
            setError("The example route data could not be loaded.");
            setLoading(false, "");
            return;
          }
        } else {
          setLoading(true, "Reading your cart…");
          rawFrag = getFragmentFromUrlOrStorage();
        }
        const cache   = loadCache();

        // If no fragment, try to restore entire view from cache
        if (!rawFrag) {
          if (cache && cache.svg) {
            setLoading(true, "Loading your last route…");
            const svg = mountSVG(cache.svg, { target: document.getElementById("out"), id: "output-svg" });
            recolorMountedSVG();
            // Ensure viewBox baseline is the original, so click-zoom math uses stable coords
            if (cache.initialVb) svg.setAttribute('viewBox', cache.initialVb);
            drawOverlayFromCache(svg, cache);
            renderSteps(cache.stepList || []);
            // step click handling needs raw pts & mapping function
            // build toSvg based on viewBox origin captured in cache
            const vbBase = (cache.initialVb || svg.dataset.initialVb || svg.getAttribute('viewBox') || '0 0 1000 1000');
            const [ix,iy] = vbBase.split(/[\s,]+/).map(Number);
            const toSvg = (x,y)=>[ix + x, iy + y];
            hookStepClicksAbs(svg, cache.waypoints || []);
            setLoading(false, "");
            return;
          }
          try { localStorage.removeItem(LS_KEY_FRAGMENT); } catch {}
          try { localStorage.removeItem(LS_KEY_CACHE); } catch {}
          location.replace(SETUP_URL);
          setError("No cart to show yet.");
          setLoading(false, "");
          return;
        }

        // We have a fragment: decode and compute its hash
        setLoading(true, "Reading your cart…");
        const decoded = decodeURIComponent(rawFrag);
        const trimmed = decoded.length >= 2 ? decoded.slice(1, -1) : decoded; // your existing normalization
        const fragHash = hashStr(demoJson ?? trimmed);

        // If cache matches, short-circuit
        if (cache && cache.fragmentHash === fragHash && cache.svg) {
          setLoading(true, "Loading your last route…");
          const svg = mountSVG(cache.svg, { target: document.getElementById("out"), id: "output-svg" });
          recolorMountedSVG();
// Reset to the original viewBox before any framing
if (cache.initialVb) svg.setAttribute('viewBox', cache.initialVb);
drawOverlayFromCache(svg, cache);
          renderSteps(cache.stepList || []);
          const vbBase = (cache.initialVb || svg.dataset.initialVb || svg.getAttribute('viewBox') || '0 0 1000 1000');
const [ix,iy] = vbBase.split(/[\s,]+/).map(Number);
const toSvg = (x,y)=>[ix + x, iy + y];
          hookStepClicksAbs(svg, cache.waypoints || []);
          setLoading(false, "");
          return;
        }

        // Else, decompress + run WASM and then build & save cache
        setLoading(true, "Reading your cart…");
        const json = demoJson ?? LZString.decompressFromEncodedURIComponent(trimmed);
        if(!json){ setError("Couldn’t read the cart data. Share your cart from H-E-B again to get a fresh link."); setLoading(false, ""); return; }

        const payload = JSON.parse(json);
        const svg_data = payload["svg"];
        if (!svg_data) { setError("This cart is missing the store map. Try sharing it again."); setLoading(false, ""); return; }

        // Mount SVG first so measurement APIs work
        const svg = mountSVG(svg_data, { target: document.getElementById("out"), id: "output-svg" });
        recolorMountedSVG();

        // Run WASM
        setLoading(true, "Finding the route…");
        const dataRaw = await runWithData(json);
        if (!dataRaw) { setError("Something went wrong finding the route. Reload and try again."); setLoading(false, ""); return; }
        let data; try { data = JSON.parse(dataRaw); } catch { setError("Something went wrong finding the route. Reload and try again."); setLoading(false, ""); return; }

        const polyline = data["polyline"]; 
        const item_mask = data["mask"]; // kept for completeness
        if(!polyline){ setLoading(false, "Couldn’t find a route through the store."); return; }

        // Utilities to map points into SVG space
        const vb = svg.getAttribute('viewBox'); 
        if(!vb) throw new Error('SVG has no viewBox');
        const [minX,minY] = vb.split(/[\s,]+/).map(Number);
        const toSvg = (x,y)=>[minX + x, minY + y];

        // Parse the polyline into numeric points once
        const pts = polyline
          .replace(/[\[\]]/g,'')
          .split(/[\s,]+/)
          .filter(Boolean)
          .reduce((acc,val,i,arr)=>{ if(i%2===0) acc.push([Number(val), Number(arr[i+1])]); return acc; },[]);

        // Build step metadata from product info
        const productInfo = buildProductInfo(payload);

        // Draw overlays + construct waypoints
        const NS = 'http://www.w3.org/2000/svg';
        const g = document.createElementNS(NS,'g');
        g.setAttribute('pointer-events','none');

        const polyline_points_svg = pts.map(([x,y])=>{ const [sx,sy]=toSvg(x,y); return `${sx},${sy}`; });
        drawRouteLine(g, polyline_points_svg.join(' '));

        const firstSeen = new Map();
        let counter=1; 
        const waypoints=[];    // for UI rendering
        const stepList=[];     // for side panel

        pts.forEach(([x,y], idx)=>{
          const pid = Number(item_mask?.[idx]||0);
          if(!pid) return;
          if(firstSeen.has(pid)) return;
          firstSeen.set(pid, idx);

          const [sx,sy] = toSvg(x,y);

          const info = productInfo[pid] || { title: '', subtitle: '' };
          const tipSub  = info.subtitle ? ` — ${info.subtitle}` : '';
          const tipText = `${counter}. ${info.title || ''}${tipSub}`;

          waypoints.push({ n: counter, pid, cx: sx, cy: sy, tipText });
          stepList.push({ n: counter, pid, title: info.title || '', subtitle: info.subtitle || '', index: idx });
          counter++;
        });

        waypoints.forEach((wp, i) => {
          g.appendChild(makeStop({
            n: wp.n, sx: wp.cx, sy: wp.cy, tipText: wp.tipText,
            terminal: i === 0 || i === waypoints.length - 1
          }));
        });
        svg.appendChild(g);
        rescaleStops();

        renderSteps(stepList);
        hookStepClicks(svg, stepList, pts, toSvg);

        // Open on the whole run, so you can see the shape of the trip first.
        if(stepList.length){
          framePoints(svg, stepList.map(s => { const p = pts[s.index]; return toSvg(p[0], p[1]); }), 0.08);
        }

        // ✅ SAVE structured cache so we can restore without recompute
        const cacheObj = {
          fragmentHash: fragHash,
          initialVb: svg.getAttribute('viewBox'),
          svg: svg_data,
          polyline: polyline,                      // raw polyline string (optional)
          polyline_points_svg,                     // precomputed "x,y" strings to avoid re-map
          pts,                                     // raw numeric points in local coords
          mask: item_mask || [],
          waypoints,                               // for drawing (cx,cy,n,…)
          stepList,                                // for sidebar & clicks
          productInfo                               // may be useful to show additional info later
        };
        saveCache(cacheObj);

        console.log({ restored: false, pts_length: pts.length, steps: stepList.length });
        setLoading(false, "");
      }

      main();

      // Error piping to the textarea console
      window.onerror = function(message, source, lineno, colno, error) {
        // Always hide loader on any uncaught error
        try { setLoading(false); } catch {}

        const errorMessage = `Error: ${message}\nSource: ${source}\nLine: ${lineno}, Column: ${colno}\nStack: ${error ? error.stack : 'N/A'}\n\n`;
        const el = document.getElementById("json");
        if (el) el.value += errorMessage;
        return true;
      };
      (function hijackConsole(){
        const orig = window.console.log;
        window.console.log = function(...args){
          orig.apply(console, args);
          const textarea = document.getElementById('json');
          if(textarea){
            const logMessage = args.map(arg => {
              try { return typeof arg === 'object' && arg !== null ? JSON.stringify(arg) : String(arg); }
              catch { return String(arg); }
            }).join(' ');
            textarea.value += logMessage + '\n';
          }
        };
      })();
    </script>

  </body>
